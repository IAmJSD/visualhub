name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Set up the signing keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64}" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret; this build will be unsigned."
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/visualhub-signing.keychain-db"
          # The keychain is thrown away with the runner, so a password only has
          # to be unguessable for the length of this job.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Prepend rather than replace: notarytool still wants the login
          # keychain on the search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          # Let codesign use the key without prompting for the password.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "The certificate imported but holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "MACOS_CERT_NAME=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package
        env:
          # MACOS_CERT_NAME and MACOS_KEYCHAIN come from the keychain step
          # above; these three are what notarytool authenticates with.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          make release
          # Upload the zip and image alone: upload-artifact does not keep the
          # bundle's permissions or symlinks, which would void the signature.
          rm -rf dist/VisualHub.app

      - uses: actions/upload-artifact@v5
        with:
          name: visualhub-macos
          path: dist/*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: visualhub-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: visualhub-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System deps
        run: |
          sudo apt-get update
          # What GPUI links and builds against on Linux.
          sudo apt-get install -y libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
          # libfuse2: appimagetool. rpm: rpmbuild, for the .rpm.
          # libarchive-tools: bsdtar, which writes the .pkg.tar.zst's .MTREE.
          sudo apt-get install -y libfuse2 rpm libarchive-tools zstd

      - name: Package
        run: |
          curl -sSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$(uname -m).AppImage"
          chmod +x /tmp/appimagetool
          mkdir -p dist
          APPIMAGETOOL=/tmp/appimagetool ./packaging/linux/appimage.sh
          ./packaging/linux/packages.sh
          # The bare binary too, arch-suffixed: both Linux jobs publish into
          # one release, and same-named assets would collide there.
          cp target/release/visualhub "dist/visualhub-linux-$(uname -m)"
          strip --strip-unneeded "dist/visualhub-linux-$(uname -m)"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/visualhub.exe dist/visualhub-windows-x86_64.exe
          # NSIS isn't on the runner image.
          choco install nsis --no-progress -y
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) {
            $found = Get-Command makensis -ErrorAction SilentlyContinue
            if (-not $found) { throw 'makensis missing after installing NSIS' }
            $makensis = $found.Source
          }
          # Quoted: unquoted, PowerShell hands makensis the literal text, and
          # a ':' in the OutFile writes the installer into an NTFS stream.
          & $makensis "-DVERSION=$version" packaging/windows/installer.nsi
          $out = "dist/VisualHub-$version-setup.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -eq 0) { throw "no installer at $out" }

      - uses: actions/upload-artifact@v5
        with:
          name: visualhub-windows-x86_64
          path: dist/*

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
