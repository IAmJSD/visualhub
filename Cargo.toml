[package]
name = "visualhub"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A native GitHub client built on GPUI and Schist's widget kit"

[[bin]]
name = "visualhub"
path = "src/main.rs"

[dependencies]
# Schist's widget kit: buttons, fields, popovers, modals and the palette
# they draw with. Taken from the local checkout so both apps share one
# set of chrome; it must be built against the same gpui as this crate.
schist-ui = { path = "../../../schist/crates/ui" }
# The same fork and revision Schist pins, so `schist-ui`'s elements and
# ours are the same gpui types.
gpui = { git = "https://github.com/IAmJSD/gpui", rev = "0f78678d38c244cc20540f190877d4573be58c9b" }
anyhow = "1"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
crypto_box = { version = "0.9", features = ["seal"] }
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# gpui's vendored crates, restated from the fork (Cargo only honours
# `[patch]` in the top-level manifest), exactly as Schist does.
[patch.crates-io]
gpui_util = { git = "https://github.com/IAmJSD/gpui", rev = "0f78678d38c244cc20540f190877d4573be58c9b" }
gpui_http_client = { git = "https://github.com/IAmJSD/gpui", rev = "0f78678d38c244cc20540f190877d4573be58c9b" }
blade-graphics = { git = "https://github.com/IAmJSD/gpui", rev = "0f78678d38c244cc20540f190877d4573be58c9b" }
