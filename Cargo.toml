[package]
name = "visualhub"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A native GitHub client built on GPUI"

[[bin]]
name = "visualhub"
path = "src/main.rs"

[dependencies]
# The fork and revision Schist pins; the widget kit in src/ui is copied
# from Schist and written against it.
gpui = { git = "https://github.com/IAmJSD/gpui", rev = "0f78678d38c244cc20540f190877d4573be58c9b" }
anyhow = "1"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
crypto_box = { version = "0.9", features = ["seal"] }
log = "0.4"
env_logger = "0.11"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
diffy = "0.4"

[build-dependencies]
# The Windows executable's icon; only used when building for Windows.
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# gpui's vendored crates, restated from the fork (Cargo only honours
# `[patch]` in the top-level manifest), exactly as Schist does.
[patch.crates-io]
gpui_util = { git = "https://github.com/IAmJSD/gpui", rev = "0f78678d38c244cc20540f190877d4573be58c9b" }
gpui_http_client = { git = "https://github.com/IAmJSD/gpui", rev = "0f78678d38c244cc20540f190877d4573be58c9b" }
blade-graphics = { git = "https://github.com/IAmJSD/gpui", rev = "0f78678d38c244cc20540f190877d4573be58c9b" }
